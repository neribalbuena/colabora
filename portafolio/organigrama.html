<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organigrama</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #e0f7fa, #ffffff);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .link {
            background-color: #0077b6;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        .link a {
            color: white;
            text-decoration: none;
            font-size: 28px;
            transition: 0.3s;
        }

        .link a:hover {
            color: #90e0ef;
        }

        .contenedor {
            max-width: 900px;
            margin: 40px auto;
            padding: 25px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .organigrama {
            max-width: 100%;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1 class="link">
        <a href="inicio.html">Volver al inicio</a>
    </h1>

    <div class="contenedor">
        <img src="organigrama.PNG" class="organigrama">
    </div>

</body>
</html>
